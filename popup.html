<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Workspaces</title>
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">CURRENT WORKSPACE</span>
        <h1 id="active-workspace">General</h1>
      </header>
      <section class="workspace-section" aria-label="Workspaces">
        <div class="section-heading">
          <span>Switch workspace</span>
          <span id="workspace-count" class="count"></span>
        </div>
        <div id="workspaces"></div>
      </section>
      <section class="favorites-section">
        <div class="section-heading">
          <span>Favorites</span>
          <button id="open-all-favorites" type="button">Open all</button>
        </div>
        <div id="favorites"></div>
      </section>
      <details class="manage-workspace">
        <summary>Manage workspace</summary>
        <form id="new-workspace">
          <label class="sr-only" for="workspace-name">New workspace</label>
          <input id="workspace-name" type="text" placeholder="New workspace" maxlength="40" required>
          <button type="submit">Add</button>
        </form>
        <button id="rename-workspace" class="secondary-action" type="button">Rename current workspace</button>
        <section class="appearance-section">
          <label for="workspace-icon">Workspace appearance</label>
          <div class="appearance-controls">
            <div class="appearance-row">
              <div id="appearance-preview" aria-hidden="true">●</div>
              <input id="workspace-icon" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Emoji or 2 characters" aria-label="Workspace icon">
            </div>
            <div id="color-picker" aria-label="Workspace color">
              <div id="color-area" role="slider" tabindex="0" aria-label="Saturation and brightness"><div id="color-area-thumb"></div></div>
              <div id="hue-slider" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><div id="hue-thumb"></div></div>
            </div>
            <div class="appearance-row">
              <input id="workspace-color-hex" type="text" maxlength="7" autocomplete="off" spellcheck="false" aria-label="Hex color" placeholder="#0060df">
              <button id="save-workspace-style" type="button">Save</button>
            </div>
          </div>
        </section>
      </details>
    </main>
    <script src="appearance.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
